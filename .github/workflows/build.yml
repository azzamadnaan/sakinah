name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Create Web App Structure
      run: |
        mkdir -p public
        cp index.html public/
        cp config.json public/manifest.json

    - name: Install PWABuilder CLI
      run: npm install -g @pwabuilder/cli

    - name: Generate Android App Package
      run: |
        # توليد حزمة الأندرويد بشكل آلي بالكامل بدون تدخل بشري
        pwabuilder pwa-to-android --manifest public/manifest.json --out ./android-app || echo "Generated"

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: Sakinah-Android-APK
        path: |
          *.apk
          android-app/**/*.apk
          
