name: Build Sakinah APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y zip unzip git openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install Buildozer & Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade buildozer cython==0.29.36 pexpect

    - name: Force Correct Spec File
      run: |
        # حذف الملف القديم بالكامل وإنشاء ملف نظيف بالخصائص الصحيحة مباشرة
        rm -f buildozer.spec
        cat << 'EOF' > buildozer.spec
        [app]
        title = Sakinah
        package.name = sakinah
        package.domain = org.sakinah
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 1.0
        requirements = python3,kivy,requests
        orientation = portrait
        osx.python_version = 3
        osx.kivy_version = 1.9.1
        fullscreen = 0
        android.api = 28
        android.min_api = 21
        android.sdk = 28
        android.ndk = 21e
        android.accept_sdk_license = True
        [buildozer]
        log_level = 2
        warn_on_root = 0
        EOF

    - name: Build APK Clean
      run: |
        export P4A_ACCEPT_LICENSE=1
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sakinah-App-APK
        path: bin/*.apk
        
