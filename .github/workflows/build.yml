name: Build APK with Briefcase

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install briefcase

    - name: Create Briefcase Template (if not exists)
      run: |
        if [ ! -f pyproject.toml ]; then
          briefcase new --template cookiecutter --no-input app_name="Sakinah" formal_name="Sakinah" bundle="com.sakinah.app" project_name="Sakinah" app_class="Sakinah" gui_framework="kivy"
        fi

    - name: Build Android APK
      run: |
        cd src
        briefcase create android
        briefcase build android
        briefcase package android --no-sign

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sakinah-Android-APK
        path: src/android/gradle/app/build/outputs/apk/debug/*.apk
        
