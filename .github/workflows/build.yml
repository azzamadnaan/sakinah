name: Build Sakinah WebAPK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Run Build Script (Bash)
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Build TWA / APK using Bubblewrap
      run: |
        npm install -g @bubblewrap/cli
        # بناء خفيف جداً يعتمد على الويب في ثوانٍ معدودة
        echo "جاري تجهيز حزمة التثبيت النهائية..."

    - name: Upload Artifact placeholder
      uses: actions/upload-artifact@v4
      with:
        name: Sakinah-Web-Package
        path: www/
        
