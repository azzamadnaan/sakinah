name: Build Sakinah APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y zip unzip git openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install Buildozer & Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade buildozer cython==0.29.36 pexpect

    - name: Create Clean Spec File
      run: |
        rm -f buildozer.spec
        buildozer init -n
        
        # كتابة إعدادات متوافقة ومستقرة مباشرة داخل الملف لتجنب مشاكل الرخص
        echo "requirements = python3,kivy,requests" >> buildozer.spec
        echo "android.api = 30" >> buildozer.spec
        echo "android.min_api = 21" >> buildozer.spec
        echo "android.sdk = 30" >> buildozer.spec

    - name: Build APK Clean
      run: |
        export P4A_ACCEPT_LICENSE=1
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sakinah-App-APK
        path: bin/*.apk
        
